name: Changelog

on:
  pull_request:
    branches: [main]

# Only reads the diff between branches -- never needs to write anything.
permissions:
  contents: read

jobs:
  require-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require CHANGELOG.md to be updated
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated — good."
          else
            echo "::error::This PR doesn't update CHANGELOG.md. Add a line under [Unreleased] describing what changed — see CHANGELOG.md for the format."
            exit 1
          fi
