name: Verify

# Runs on pushes to main as well as pull requests, on purpose.
#
# The changelog check only runs on pull_request, so a direct push to main skips
# it entirely — which has already happened. Whatever else is true, main should
# at least be known to compile.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only checks out code, installs deps, and runs local build/typecheck --
# never needs to write anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
      # which catches a dependency added without the lockfile being committed.
      - run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high

      # Type errors don't fail `vite build` — Vite strips types without
      # checking them — so this has to be its own step. Without it, code that
      # doesn't typecheck merges green.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # A committed conflict marker is valid text to git and to Vite, so
      # nothing above necessarily catches it. This has reached a PR before.
      - name: Reject conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- src supabase tools; then
            echo "::error::Merge conflict markers are committed in the lines above."
            exit 1
          fi
          echo "No conflict markers found."
